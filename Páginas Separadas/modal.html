<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal — SBE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
<div class="ribbon"><span class="g"></span><span class="y"></span><span class="w"></span></div>

<div class="modal-backdrop active" style="position:relative;min-height:calc(100vh - 6px);background:rgba(22,36,28,.45);">
  <div class="modal">
    <a href="catalogo.html" class="modal-close">Fechar ✕</a>
    <div class="book-call mono">REGISTRO</div>
    <h2>Detalhes do livro</h2>
    <p class="modal-desc">As informações do exemplar serão carregadas pelo sistema quando houver integração com o banco de dados.</p>
    <div class="modal-meta">
      <div><span>Autor</span><b>—</b></div>
      <div><span>Status</span><b>—</b></div>
      <div><span>Registro</span><b>—</b></div>
    </div>
    <div class="modal-actions">
      <a href="catalogo.html" class="btn-secondary">Voltar ao catálogo</a>
    </div>
  </div>
</div>

</body>
</html>
